<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="viewport" width="width=device-width, initial-scale=1.0">
    <title>Product Preview Card</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <main>
      <div class="card">
        <div class="card-container">
          <div class="image">
           <img class="product-desktop" src="image-product-desktop.jpg">
          </div>
          <div class="text">
            <p class="header">P E R F U M E</p>
            <p class="title">Gabrielle Essence Eau De Parfum</p>
            <p class="info">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
            <div class="pricing">
              <p class="price">$149.99</p>
              <p class="strikethrough-price">$169.99</p>
            </div>
            <div class="button">
              <button class="btn"><img class="btn-img" src="icon-cart.svg">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
      
    </main>
  </body>
